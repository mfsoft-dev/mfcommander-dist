name: Bug report
description: Report a problem with MFCommander.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Reports are public: remove passwords, tokens, license keys, and personal information from logs and screenshots."
  - type: input
    id: app-version
    attributes:
      label: MFCommander version
      description: Find the version and build in About MFCommander.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected connection type or file type, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots or redacted logs.
