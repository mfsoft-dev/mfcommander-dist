name: Feature request
description: Suggest an improvement to MFCommander.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Requests are public: do not include confidential information."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like MFCommander to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
